services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: ega-lgs-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: EgaAdminPassword123!
      APP_USER: EGA_ADMIN
      APP_USER_PASSWORD: EgaAdminPassword123!
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./src/EgaLgs.Api/Database:/docker-entrypoint-initdb.d:ro

volumes:
  oracle_data:
